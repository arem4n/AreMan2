    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        window.scrollTo(0, 0);

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
    <script>
    tailwind.config = {
      theme: {
        extend: {
            colors: {
                'symbolic': { 50: '#fdf2f8', 100: '#fce7f3', 200: '#fbcfe8', 300: '#f9a8d4', 400: '#f472b6', 500: '#ec4899', 600: '#db2777', 700: '#be185d', 800: '#9d174d', 900: '#831843' },
                'deep': { 50: '#f8fafc', 100: '#f1f5f9', 200: '#e2e8f0', 300: '#cbd5e1', 400: '#94a3b8', 500: '#64748b', 600: '#475569', 700: '#334155', 800: '#1e293b', 900: '#0f172a' },
                'creative': { 50: '#fefce8', 100: '#fef9c3', 200: '#fef08a', 300: '#fde047', 400: '#facc15', 500: '#eab308', 600: '#ca8a04', 700: '#a16207', 800: '#854d0e', 900: '#713f12' }
            },
            fontFamily: {
                'display': ['Playfair Display', 'serif'],
                'body': ['Inter', 'sans-serif']
            }
        }
      }
    }
    </script>
    <style>
        @tailwind base;
        @tailwind components;
        @tailwind utilities;

        /* Critical utility for strict carousel snapping */
        .snap-always {
            scroll-snap-stop: always;
        }

        .text-gradient {
            background: linear-gradient(135deg, #db2777, #475569);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .animate-float {
            animation: float 6s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .elegant-menu-button {
            position: fixed;
            top: 0.75rem;
            right: 1.5rem;
            z-index: 1020; /* Increased to stay above modals (z-1000) */
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #db2777 0%, #475569 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            box-shadow: 0 8px 25px rgba(219, 39, 119, 0.3);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.1);
        }
        .elegant-menu-button:hover {
            transform: scale(1.05) rotate(5deg);
            box-shadow: 0 12px 35px rgba(219, 39, 119, 0.4);
        }
        .elegant-menu-button.active {
            transform: scale(0.95) rotate(45deg);
            background: linear-gradient(135deg, #475569 0%, #db2777 100%);
        }
        .menu-lines {
            position: relative;
            width: 28px;
            height: 3px;
            background: white;
            border-radius: 2px;
            transition: all 0.25s ease-in-out;
            transform-origin: center center;
        }
        .menu-lines::before,
        .menu-lines::after {
            content: '';
            display: block;
            position: absolute;
            height: 3px;
            width: 100%;
            background: white;
            border-radius: 2px;
            left: 0;
            transition: all 0.25s ease-in-out;
            transform-origin: center center;
        }
        .menu-lines::before {
            top: -8.5px;
        }
        .menu-lines::after {
            top: 8.5px;
        }
        .elegant-menu-button.active .menu-lines {
            background: transparent;
        }
        .elegant-menu-button.active .menu-lines::before {
            top: 0px;
            transform: rotate(45deg);
        }
        .elegant-menu-button.active .menu-lines::after {
            top: 0px;
            transform: rotate(-45deg);
        }
        @media (min-width: 768px) {
             .elegant-menu-button {
                display: none;
            }
            section[id] {
                scroll-margin-top: 80px;
            }
        }

        .page-transition {
            transition: opacity 0.3s ease-in-out;
        }
        .page-transition-exit {
            opacity: 0;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in-up {
            animation: fadeInUp 0.6s ease-out forwards;
            opacity: 0;
        }

        @keyframes highlight-pulse {
            0% {
                box-shadow: 0 0 0 0px rgba(236, 72, 153, 0.7);
                border-color: #ec4899;
            }
            100% {
                box-shadow: 0 0 0 15px rgba(236, 72, 153, 0);
                border-color: #be185d;
            }
        }
        .highlight-on-focus {
            animation: highlight-pulse 1.2s ease-out;
        }

        .scroll-animate {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.8s cubic-bezier(0.2, 0.8, 0.2, 1), transform 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
            transition-delay: 0.1s;
        }
        .scroll-animate.is-visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* CRITICAL FIX: Modal scroll lock */
        html.modal-open,
        html.modal-open body {
            overflow: hidden !important;
            height: 100vh !important;
            touch-action: none; /* Prevent scroll on mobile */
        }

        #preloader {
            position: fixed;
            inset: 0;
            z-index: 99999;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0f172a;
            transition: opacity 0.5s ease-in-out;
        }
        #preloader.preloader-hiding {
            opacity: 0;
            pointer-events: none;
        }
        .preloader-container {
            position: relative;
            width: 170px;
            height: 170px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        @media (min-width: 1024px) {
            .preloader-container {
                width: 600px;
                height: 600px;
            }
        }

        .preloader-spinner {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: conic-gradient(from 90deg, transparent 0%, rgba(249, 168, 212, 0.1) 50%, #ec4899 95%, #fbcfe8 100%);
            -webkit-mask-image: radial-gradient(transparent 65%, black 66%);
            mask-image: radial-gradient(transparent 65%, black 66%);
            filter: blur(8px);
            animation: spin 2s linear infinite;
        }
        #preloader .preloader-logo {
            width: 110px;
            height: 110px;
            animation: preloader-pulse 2s ease-in-out infinite;
            background-color: #ec4899;
            -webkit-mask-image: url('https://i.postimg.cc/Tw57pbrX/retouch-2025082016164562.png');
            mask-image: url('https://i.postimg.cc/Tw57pbrX/retouch-2025082016164562.png');
            -webkit-mask-size: contain;
            mask-size: contain;
            -webkit-mask-position: center;
            mask-position: center;
            -webkit-mask-repeat: no-repeat;
            mask-repeat: no-repeat;
        }
        @media (min-width: 1024px) {
            #preloader .preloader-logo {
                width: 400px;
                height: 400px;
            }
        }

        @keyframes preloader-pulse {
            0%, 100% { transform: scale(1); opacity: 1; filter: drop-shadow(0 0 5px #fbcfe8); }
            50% { transform: scale(1.05); opacity: 0.9; filter: drop-shadow(0 0 12px #ec4899); }
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .main-content-wrapper {
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
            transition-delay: 0.2s;
        }
        .main-content-wrapper.visible {
            opacity: 1;
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
            .animate-float, .animate-fade-in-up, .scroll-animate, .page-transition {
                animation: none !important;
                transition: none !important;
            }
        }

        :focus-visible {
            outline: 3px solid #f472b6;
            outline-offset: 3px;
            border-radius: 4px;
        }
        .elegant-menu-button:focus-visible {
            outline-color: #fef08a;
        }
        input:focus-visible, textarea:focus-visible {
            outline: none;
        }
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* 3D Portfolio Carousel Styles */
        .portfolio-3d-container {
            perspective: 1000px; /* Distance of the viewer */
            transform-style: preserve-3d;
        }
        
        /* We'll use inline styles for dynamic transforms, but basic transitions here */
        .carousel-card-wrapper {
            position: absolute;
            top: 50%;
            left: 50%;
            transform-style: preserve-3d; 
            transition: all 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            will-change: transform, opacity, filter;
        }
    </style>
